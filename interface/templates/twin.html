<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHYGENT — Digital Twin</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: system-ui; padding: 20px; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,254,0.2); padding-bottom: 10px; margin-bottom: 20px; }
        header a { color: #00f2fe; text-decoration: none; margin-left: 15px; }
        #canvasFull { width: 100%; height: 500px; background: #050811; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <h2>🧊 DIGITAL TWIN 3D VISUALIZER</h2>
        <nav><a href="/">HOME</a><a href="/world">WORLD</a><a href="/twin">TWIN</a><a href="/agent">AGENT</a><a href="/robot">ROBOT</a><a href="/learning">LEARNING</a><a href="/system">SYSTEM</a></nav>
    </header>
    <div id="canvasFull"></div>
    <div style="margin-top: 15px;">
        Commanded Joints: <span id="cmdJ">[90, 45, 45, 30, 90]</span> | Measured Joints: <span id="measJ">[90, 45, 45, 30, 90]</span>
    </div>
    <script>
        const container = document.getElementById('canvasFull');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(400, 400, 400); camera.lookAt(0, 100, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);
        scene.add(new THREE.GridHelper(500, 25, 0x00f2fe, 0x1e293b));
        scene.add(new THREE.AmbientLight(0xffffff));

        const arm = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(50, 50, 20, 16), new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true }));
        arm.add(base); scene.add(arm);

        function anim() { requestAnimationFrame(anim); renderer.render(scene, camera); }
        anim();

        const ev = new EventSource('/api/stream/state');
        ev.onmessage = e => {
            const d = JSON.parse(e.data);
            if(d && d.robot) {
                document.getElementById('cmdJ').innerText = JSON.stringify(d.robot.joints_commanded || []);
                document.getElementById('measJ').innerText = JSON.stringify(d.robot.joints_measured || []);
            }
        };
    </script>
</body>
</html>
