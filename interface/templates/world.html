<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHYGENT — World Perception</title>
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: system-ui; padding: 20px; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,254,0.2); padding-bottom: 10px; margin-bottom: 20px; }
        header a { color: #00f2fe; text-decoration: none; margin-left: 15px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: rgba(18,26,43,0.75); border: 1px solid rgba(0,242,254,0.2); border-radius: 8px; padding: 20px; }
        .feed { width: 100%; height: 400px; background: #000; border-radius: 6px; overflow: hidden; }
        .feed img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <h2>👁 WORLD PERCEPTION</h2>
        <nav><a href="/">HOME</a><a href="/world">WORLD</a><a href="/twin">TWIN</a><a href="/agent">AGENT</a><a href="/robot">ROBOT</a><a href="/learning">LEARNING</a><a href="/system">SYSTEM</a></nav>
    </header>
    <div class="grid">
        <div class="card">
            <h3>Live Workspace Video Overlay</h3>
            <div class="feed"><img src="/video_feed"></div>
        </div>
        <div class="card">
            <h3>Perception State</h3>
            <p>Detection: <span id="det">ONLINE</span></p>
            <p>Person Present: <span id="pp">False</span></p>
            <p>Velocity (vx, vy): <span id="vel">(0, 0)</span></p>
            <p>Direction: <span id="dir">0°</span></p>
        </div>
    </div>
    <script>
        const ev = new EventSource('/api/stream/state');
        ev.onmessage = e => {
            const d = JSON.parse(e.data);
            if(d) {
                document.getElementById('pp').innerText = d.person_present;
                if(d.objects && d.objects.length > 0) {
                    document.getElementById('vel').innerText = `(${d.objects[0].vx || 0}, ${d.objects[0].vy || 0})`;
                }
            }
        };
    </script>
</body>
</html>
