<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHYGENT — Agent Brain</title>
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: system-ui; padding: 20px; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,254,0.2); padding-bottom: 10px; margin-bottom: 20px; }
        header a { color: #00f2fe; text-decoration: none; margin-left: 15px; }
        .card { background: rgba(18,26,43,0.75); border: 1px solid rgba(0,242,254,0.2); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h2>🧠 AGENT COGNITION & AUTONOMY STATE</h2>
        <nav><a href="/">HOME</a><a href="/world">WORLD</a><a href="/twin">TWIN</a><a href="/agent">AGENT</a><a href="/robot">ROBOT</a><a href="/learning">LEARNING</a><a href="/system">SYSTEM</a></nav>
    </header>
    <div class="card">
        <h3>Autonomy State Machine</h3>
        <p>Current State: <strong id="astate" style="color:#00f2fe;">OBSERVE</strong></p>
        <p>Active Task: <span id="atask">TRACKING</span></p>
    </div>
    <div class="card">
        <h3>Grok LLM Reasoning Explanation</h3>
        <p id="grokReasoning">Awaiting context evaluation...</p>
    </div>
    <script>
        const ev = new EventSource('/api/stream/state');
        ev.onmessage = e => {
            const d = JSON.parse(e.data);
            if(d && d.agent) document.getElementById('astate').innerText = d.agent.autonomy_state;
            if(d && d.decision) document.getElementById('grokReasoning').innerText = d.decision.grok_reasoning || d.decision.reason;
        };
    </script>
</body>
</html>
